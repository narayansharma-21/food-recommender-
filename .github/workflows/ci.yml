name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile, check formatting, run migrations, and test
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          ./gradlew --no-daemon --no-watch-fs --console=plain clean check 2>&1 | tee .ci/gradle.log

      - name: Report Java build failure
        if: failure()
        run: python3 .github/scripts/report_ci_failure.py .ci/gradle.log build/test-results/test

      - name: Test ML evaluation jobs
        run: python3 -m unittest discover -s ml/tests -v

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: food_recommender_test
          POSTGRES_USER: food_recommender
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_recommender -d food_recommender_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/food_recommender_test
      SPRING_DATASOURCE_USERNAME: food_recommender
      SPRING_DATASOURCE_PASSWORD: integration-test-only

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run migrations and validate the production schema
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          ./gradlew --no-daemon --no-watch-fs --console=plain clean test \
            --tests com.narayansharma.foodrecommender.FoodRecommenderBackendApplicationTests \
            2>&1 | tee .ci/gradle.log

      - name: Report PostgreSQL validation failure
        if: failure()
        run: python3 .github/scripts/report_ci_failure.py .ci/gradle.log build/test-results/test

      - name: Verify database backup and restore
        shell: bash
        run: |
          set -euo pipefail
          postgres_container=$(docker ps \
            --filter ancestor=postgres:17.6-alpine \
            --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"

          docker exec "$postgres_container" mkdir -p /tmp/database-scripts
          docker cp scripts/database/. "$postgres_container:/tmp/database-scripts"

          docker exec -e PGPASSWORD=integration-test-only "$postgres_container" \
            psql --host=127.0.0.1 --username=food_recommender \
            --dbname=food_recommender_test --set ON_ERROR_STOP=1 \
            --command "INSERT INTO background_jobs (
              id, job_type, payload, status, available_at, created_at, updated_at
            ) VALUES (
              '00000000-0000-0000-0000-000000000001', 'BACKUP_TEST', '{}', 'COMPLETED',
              CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
            )"

          docker exec -e PGPASSWORD=integration-test-only "$postgres_container" \
            sh /tmp/database-scripts/backup.sh \
            postgresql://food_recommender@127.0.0.1:5432/food_recommender_test \
            /tmp/food-recommender.backup

          docker exec -e PGPASSWORD=integration-test-only "$postgres_container" \
            psql --host=127.0.0.1 --username=food_recommender \
            --dbname=food_recommender_test --set ON_ERROR_STOP=1 \
            --command "DELETE FROM background_jobs WHERE job_type = 'BACKUP_TEST'"

          docker exec \
            -e PGPASSWORD=integration-test-only \
            -e CONFIRM_DATABASE_RESTORE=yes \
            "$postgres_container" \
            sh /tmp/database-scripts/restore.sh \
            postgresql://food_recommender@127.0.0.1:5432/food_recommender_test \
            /tmp/food-recommender.backup

          restored_count=$(docker exec -e PGPASSWORD=integration-test-only "$postgres_container" \
            psql --host=127.0.0.1 --username=food_recommender \
            --dbname=food_recommender_test --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM background_jobs WHERE job_type = 'BACKUP_TEST'")
          test "$restored_count" = "1"
