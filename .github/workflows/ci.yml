name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile, check formatting, run migrations, and test
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          ./gradlew --no-daemon --no-watch-fs --console=plain clean check 2>&1 | tee .ci/gradle.log

      - name: Report Java build failure
        if: failure()
        run: python3 .github/scripts/report_ci_failure.py .ci/gradle.log build/test-results/test

      - name: Test ML evaluation jobs
        run: python3 -m unittest discover -s ml/tests -v
