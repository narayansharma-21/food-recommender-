services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-food_recommender}
      POSTGRES_USER: ${DATABASE_USERNAME:-food_recommender}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-food_recommender}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-food_recommender}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      OBJECT_STORAGE_ROOT: /data
      OVERTURE_IMPORT_ON_STARTUP: ${OVERTURE_IMPORT_ON_STARTUP:-false}
      OVERTURE_PLACES_PATH: file:/imports/greater-boston-places.geojson
    ports:
      - "8080:8080"
    volumes:
      - object-storage:/data
      - ./data:/imports:ro
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres-data:
  object-storage:
