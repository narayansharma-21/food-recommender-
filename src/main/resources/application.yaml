spring:
  application:
    name: food-recommender-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food_recommender}
    username: ${DATABASE_USERNAME:food_recommender}
    password: ${DATABASE_PASSWORD:food_recommender}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

platform:
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:filesystem}
    filesystem:
      root: ${OBJECT_STORAGE_ROOT:.local-storage}

catalog:
  launch-area:
    name: Greater Boston
    region: MA
    country-code: US
    municipalities: Boston,Cambridge,Somerville,Brookline,Newton,Quincy,Medford,Everett,Chelsea,Revere,Malden,Watertown,Arlington
  overture:
    import-on-startup: ${OVERTURE_IMPORT_ON_STARTUP:false}
    minimum-records: ${OVERTURE_MINIMUM_RECORDS:100}
    snapshot: ${OVERTURE_PLACES_PATH:file:data/greater-boston-places.geojson}

menu:
  upload:
    max-bytes: ${MENU_UPLOAD_MAX_BYTES:10485760}

ocr:
  local:
    provider-version: local-ocr-v1
  pdf:
    max-bytes: ${OCR_PDF_MAX_BYTES:10485760}
    max-pages: ${OCR_PDF_MAX_PAGES:20}
    render-dpi: ${OCR_PDF_RENDER_DPI:200}
    max-rendered-pixels: ${OCR_PDF_MAX_RENDERED_PIXELS:25000000}
    minimum-embedded-text-characters: ${OCR_PDF_MINIMUM_EMBEDDED_TEXT_CHARACTERS:12}
  tesseract:
    executable: ${TESSERACT_EXECUTABLE:tesseract}
    language: ${TESSERACT_LANGUAGE:eng}
    timeout: ${TESSERACT_TIMEOUT:PT30S}
